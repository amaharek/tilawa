name: Release
# Push a tag such as v0.1.0 whose version matches manifest.json; this creates the
# GitHub release HACS / Marketplace need (a bare tag is not enough).
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("custom_components/tilawa/manifest.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match manifest version $version" >&2
            exit 1
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
